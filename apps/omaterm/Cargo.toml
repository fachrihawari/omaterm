[package]
name = "omaterm"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "omaterm-desktop"
path = "src/main.rs"

[dependencies]
async-channel = "=2.5.0"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
omaterm-core = { path = "../../crates/omaterm-core" }
omaterm-state = { path = "../../crates/omaterm-state" }
omaterm-terminal = { path = "../../crates/omaterm-terminal" }
tracing = "0.1"
