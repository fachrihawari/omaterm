[package]
name = "omaterm"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "omaterm-desktop"
path = "src/main.rs"

[dependencies]
async-channel = "=2.5.0"
base64 = "=0.22.1"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
omaterm-core = { path = "../../crates/omaterm-core" }
omaterm-context = { path = "../../crates/omaterm-context" }
omaterm-ipc = { path = "../../crates/omaterm-ipc" }
omaterm-logging = { path = "../../crates/omaterm-logging" }
omaterm-protocol = { path = "../../crates/omaterm-protocol" }
omaterm-state = { path = "../../crates/omaterm-state" }
omaterm-terminal = { path = "../../crates/omaterm-terminal" }
serde_json = "=1.0.149"
tracing = "0.1"
uuid = "=1.26.1"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
zeroize = "=1.9.0"
