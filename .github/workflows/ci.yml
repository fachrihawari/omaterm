name: CI

# Checks every push to dev and every pull request, so a broken build is
# caught before it reaches a release. Releases are release.yml's.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# Kill superseded runs on the same ref: a force-push or a rapid second push
# should not leave two full builds running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [[ -n "$out" ]]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # go build skips test files, so only vet catches a test that doesn't
      # compile for macOS or Windows.
      - name: go vet for macOS
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...

      - name: go vet for Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...

      # The terminal plugin binds libghostty-vt, a plain shared library: under
      # go test it downloads into the user's cache on first use, checking its
      # SHA-256, so the runner needs no graphics stack for it.
      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

      # Native UI builds cross-compile without cgo.
      - name: Cross-compile
        run: |
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            echo "== $target =="
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null .
          done

  # The race detector over every test but the screenshots, which write the
  # goldens and take long under it.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: |
          go test -race -count=1 -timeout 15m ./internal/... ./service/...
          go test -race -count=1 -timeout 20m -skip '^TestShots$' .

  # The tests that can run on a Mac, on one: process lookups, PTYs,
  # sockets and the web pages go through macOS's own code there. The root
  # package and e2e stay on Linux: e2e needs sway, and the app's own tests
  # haven't been made ready for a Mac.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: |
          go test -count=1 -timeout 15m \
            ./internal/agent ./internal/detect ./internal/osc ./internal/proto \
            ./internal/model ./internal/keys ./internal/notice ./internal/crash \
            ./internal/shellcmd ./internal/theme ./internal/paths ./internal/client \
            ./internal/ctl ./internal/pty ./internal/procs ./internal/gitsnap \
            ./internal/worktree ./internal/tunnel ./internal/devurl ./internal/web \
            ./internal/session ./internal/peer ./service

      # What macOS lets a user bind on port 443, which Dev URLs depend on:
      # the test logs it, and -v shows the log.
      - name: Dev URLs on port 443
        run: go test -count=1 -v -run 'TestListenTCPOnThisMac' ./internal/devurl

      # The session daemon and the omaterm command start real daemons and
      # processes, timed for Linux. They don't block a push until they have
      # proved steady on a Mac.
      - name: go test (daemon and command)
        continue-on-error: true
        run: go test -count=1 -timeout 15m ./internal/daemon ./internal/cli

  # The packages that can run on Windows, on one. Nothing has run on Windows
  # yet, so the packages that start a shell, a daemon or the app are left
  # out (see docs/research/windows.md, §4), and the job doesn't block a push
  # until it has proved steady there.
  windows:
    runs-on: windows-latest
    steps:
      # Git on Windows converts line endings on checkout, which breaks the
      # tests that compare git's output.
      - name: Keep line endings as checked in
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        continue-on-error: true
        run: >-
          go test -count=1 -timeout 15m
          ./internal/agent ./internal/detect ./internal/osc ./internal/proto
          ./internal/model ./internal/keys ./internal/notice ./internal/crash
          ./internal/theme ./internal/paths ./internal/client ./internal/ctl
          ./internal/gitsnap ./internal/worktree ./internal/tunnel ./internal/web
          ./internal/cli

  # The real app in a headless sway, driven by keys and the omaterm
  # command (e2e/). It doesn't block a push until it has proved steady on
  # the runners.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sway, wtype, grim and the app's libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes sway wtype grim dbus libwebkit2gtk-4.1-0 \
            libgl1-mesa-dri fonts-inter fonts-jetbrains-mono

      - name: End-to-end tests
        run: scripts/e2e.sh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/out/*.png
          retention-days: 7

  # The screenshots are goldens, but they are rendered with the system's
  # fonts: Inter and JetBrains Mono where they are installed, DejaVu or
  # Liberation where they are not, and every glyph's advance changes with
  # them. The runners do not have the same fonts as a developer's machine,
  # so a byte comparison there fails for reasons that are not the code.
  # Install the two families and check them against the committed goldens
  # once the CI image is pinned; until then the shots job only proves the
  # suite renders every view without panicking.
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the fonts the goldens use
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-inter fonts-jetbrains-mono || true

      - name: Render the goldens
        run: go test -run TestShots -count=1 ./...

      - name: Keep the render for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: testdata/*.png
          retention-days: 7
