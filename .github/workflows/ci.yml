name: CI

on:
  # Cost control: CI runs ONLY on dev -> main and hotfix/* -> main PRs.
  # - Pushes to any branch run 0 jobs (hotfixes go via PR, not direct push).
  # - PRs from feat/* to main are ignored (merge to dev first).
  # - Tags are handled by release.yml, not here.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:

# Kill superseded runs on the same ref (force-pushes, rapid pushes).
# With ~5 commits/day this avoids stacking full Rust builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # dev -> main, or hotfix/* -> main. feat/* PRs should target dev first.
    # Draft PRs are skipped until marked ready. Manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || ((github.head_ref == 'dev' || startsWith(github.head_ref, 'hotfix/')) && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libfontconfig1-dev libfreetype-dev libvulkan1 libwayland-dev
          libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          pkg-config
      - run: mbx fmt --all --check
      - run: mbx test --workspace
      - run: mbx clippy --workspace --all-targets -- -D warnings
      - run: mbx build --workspace

  windows-check:
    # Same gate as check above.
    if: github.event_name == 'workflow_dispatch' || ((github.head_ref == 'dev' || startsWith(github.head_ref, 'hotfix/')) && github.event.pull_request.draft == false)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      # The desktop package is excluded: GPUI's shader build needs fxc.exe,
      # which windows-latest does not put on PATH. Library crates, including
      # the named-pipe transport, do not.
      - name: Check libraries
        run: cargo check --workspace --all-targets --exclude omaterm
      - name: Named-pipe round trip
        run: cargo test -p omaterm-ipc --lib

  packaging:
    # Same gate: dev/hotfix -> main only (cheap job, but zero-cost beats cheap).
    if: github.event_name == 'workflow_dispatch' || ((github.head_ref == 'dev' || startsWith(github.head_ref, 'hotfix/')) && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-aur-sync.py
      - run: bash -n scripts/bump-aur.sh
