name: CI

# Checks every push to dev and every pull request, so a broken build is
# caught before it reaches a release. Releases are release.yml's.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# Kill superseded runs on the same ref: a force-push or a rapid second push
# should not leave two full builds running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [[ -n "$out" ]]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The terminal plugin binds libghostty-vt, a plain shared library: under
      # go test it downloads into the user's cache on first use, checking its
      # SHA-256, so the runner needs no graphics stack for it.
      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

      # Native UI builds cross-compile without cgo.
      - name: Cross-compile
        run: |
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            echo "== $target =="
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null .
          done

  # The screenshots are goldens, but they are rendered with the system's
  # fonts: Inter and JetBrains Mono where they are installed, DejaVu or
  # Liberation where they are not, and every glyph's advance changes with
  # them. The runners do not have the same fonts as a developer's machine,
  # so a byte comparison there fails for reasons that are not the code.
  # Install the two families and check them against the committed goldens
  # once the CI image is pinned; until then the shots job only proves the
  # suite renders every view without panicking.
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the fonts the goldens use
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-inter fonts-jetbrains-mono || true

      - name: Render the goldens
        run: go test -run TestShots -count=1 ./...

      - name: Keep the render for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: testdata/*.png
          retention-days: 7
