[package]
name = "omaterm-ipc"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
omaterm-protocol = { path = "../omaterm-protocol" }
serde_json = "=1.0.149"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
