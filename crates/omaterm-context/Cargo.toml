[package]
name = "omaterm-context"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[dependencies]
ignore = "=0.4.33"
notify = "=8.2.0"
fuzzy-matcher = "=0.3.7"
libc = "0.2"
omaterm-core = { path = "../omaterm-core" }
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
