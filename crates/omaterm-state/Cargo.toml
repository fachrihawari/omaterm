[package]
name = "omaterm-state"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
omaterm-core = { path = "../omaterm-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.21"
uuid = { version = "=1.26.1", features = ["v4"] }
chacha20poly1305 = "=0.11.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
hkdf = "=0.12.4"
keyring = "=4.2.0"
libc = "0.2"
sha2 = "=0.10.9"
toml_edit = "=0.25.15"
zeroize = "=1.9.0"
