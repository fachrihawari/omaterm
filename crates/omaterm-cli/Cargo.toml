[package]
name = "omaterm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "omaterm"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
clap = { version = "4.5", features = ["derive"] }
omaterm-ipc = { path = "../omaterm-ipc" }
omaterm-logging = { path = "../omaterm-logging" }
omaterm-protocol = { path = "../omaterm-protocol" }
serde_json = "=1.0.149"
tracing = "0.1"
uuid = { version = "=1.26.1", features = ["v4"] }
libc = "0.2"
